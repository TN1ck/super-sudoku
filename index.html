    <meta charset="utf-8" />

      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, shrink-to-fit=no, user-scalable=no"
    />

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#10b981" />
    <meta name="msapplication-TileColor" content="#1F2937" />
    <meta name="theme-color" content="#f1f5f9" />
    <script>
      (function () {
        try {
          var validThemes = {default: true, paper: true, "high-contrast": true};
          var theme = localStorage.getItem("theme");
          if (!theme || !validThemes[theme]) {
            theme = "default";
          }
          var rawDark = localStorage.getItem("darkMode");
          var parsedDark = rawDark ? JSON.parse(rawDark) : undefined;
          var colorMode =
            typeof parsedDark === "boolean"
              ? parsedDark
                ? "dark"
                : "light"
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.colorMode = colorMode;
          document.documentElement.style.colorScheme = colorMode;
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Play over 30,000 Sudoku puzzles ranging from easy to evil. Open source and completely free with no tracking."
    />
    <meta name="keywords" content="Sudoku,Sudoku App,Game,Sudoku Generate" />

    <meta property="og:site_name" content="Super Sudoku" />

      content="Play over 30,000 Sudoku puzzles ranging from easy to evil. Open source and completely free with no tracking."
